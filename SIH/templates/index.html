<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drone Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;}
header{background:#2c3e50;color:#fff;padding:15px;font-size:1.3rem;}
main{display:grid;grid-template-columns:2fr 2fr 1fr;gap:15px;padding:15px;height:calc(100vh - 60px);}
#videoContainer{width:100%;height:100%;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.15);}
#videoContainer img{width:100%;height:100%;object-fit:cover;}
#map{width:100%;height:100%;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.sidebar{background:#fff;border-radius:12px;padding:15px;box-shadow:0 4px 10px rgba(0,0,0,.1);overflow-y:auto;}
.sidebar h2{font-size:1.1rem;margin-bottom:10px;}
.alert-item{padding:8px;margin-bottom:8px;background:#ecf0f1;border-radius:8px;font-size:.9rem;line-height:1.3rem;}
.switch-container{margin-bottom:10px;}
button{margin-top:4px;margin-right:4px;padding:4px 8px;font-size:0.8rem;border:none;border-radius:4px;cursor:pointer;}
button.safe{background:#2ecc71;color:#fff;}
button.medical{background:#e74c3c;color:#fff;}
</style>
</head>
<body>
<header>🚁 Drone Dashboard (Live Location)</header>
<main>
<div id="videoContainer">
<img id="videoFeed" src="http://127.0.0.1:8000/video" alt="Drone video feed"/>
</div>
<div id="map"></div>
<div class="sidebar">
<h2>Alerts & Drone Location</h2>
<div class="switch-container">
<label><input type="checkbox" id="toggleView"> Show Recent Only</label>
</div>
<div id="alertList"></div>
</div>
</main>

<script>
const BASE_URL = "http://127.0.0.1:5000";
let map, droneMarker;
let droneLat=0,droneLon=0,droneTargetLat=0,droneTargetLon=0;
let alertMarkers=[];
const seenAlerts=new Set();

const droneIcon=L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/847/847969.png',iconSize:[40,40],iconAnchor:[20,20]});
const icons={
 detected:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/149/149071.png',iconSize:[30,30],iconAnchor:[15,30]}),
 safe:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/190/190411.png',iconSize:[30,30],iconAnchor:[15,30]}),
 medical:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/3125/3125713.png',iconSize:[30,30],iconAnchor:[15,30]})
};

function initMap(lat,lon){
 map=L.map('map').setView([lat,lon],14);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'&copy; OpenStreetMap contributors'
 }).addTo(map);
 droneMarker=L.marker([lat,lon],{icon:droneIcon}).addTo(map);
}

function fetchData(){
 fetch(`${BASE_URL}/alerts`).then(res=>res.json()).then(data=>{
  const alertList=document.getElementById('alertList');
  alertList.innerHTML='';

  if(data.drone){
    updateDronePosition(data.drone.lat,data.drone.lon);
    const droneDiv=document.createElement('div');
    droneDiv.className='alert-item';
    droneDiv.style.background='#dff9fb';
    droneDiv.innerHTML=`<strong>Drone Location</strong><br>Lat:${data.drone.lat.toFixed(6)}<br>Lon:${data.drone.lon.toFixed(6)}`;
    alertList.appendChild(droneDiv);
  }

  alertMarkers.forEach(m=>map.removeLayer(m));
  alertMarkers=[];

  const showRecent=document.getElementById('toggleView').checked;
  const now=Date.now();

  data.alerts.slice().reverse().forEach(alert=>{
    const alertId=alert.id;
    if(showRecent && !seenAlerts.has(alertId)) return;
    seenAlerts.add(alertId);

    const marker=L.marker([alert.lat,alert.lon],{icon:icons[alert.status]}).addTo(map);
    marker.bindPopup(`<b>Human</b><br>Status:${alert.status}<br>Lat:${alert.lat.toFixed(6)}<br>Lon:${alert.lon.toFixed(6)}<br>Time:${alert.time}`);
    alertMarkers.push(marker);

    const div=document.createElement('div');
    div.className='alert-item';
    div.innerHTML=`<strong>${alert.time}</strong><br>Lat:${alert.lat.toFixed(6)}<br>Lon:${alert.lon.toFixed(6)}<br>Status:${alert.status}<br>
    <button class="safe" onclick="markStatus('${alert.id}','safe')">Safe</button>
    <button class="medical" onclick="markStatus('${alert.id}','medical')">Medical</button>`;
    alertList.appendChild(div);
  });
 }).catch(err=>console.error('Fetch error:',err));
}

function markStatus(id,status){
 fetch(`${BASE_URL}/alert/${id}`,{
  method:'PATCH',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({status})
 }).then(()=>fetchData());
}

function updateDronePosition(lat,lon){
 droneTargetLat=lat;droneTargetLon=lon;
}

function moveDroneSmooth(){
 if(!droneMarker)return;
 const step=0.0005;
 let dLat=droneTargetLat-droneLat;
 let dLon=droneTargetLon-droneLon;
 if(Math.abs(dLat)<step&&Math.abs(dLon)<step){
  droneLat=droneTargetLat;droneLon=droneTargetLon;
 }else{
  droneLat+=dLat*0.1;droneLon+=dLon*0.1;
 }
 droneMarker.setLatLng([droneLat,droneLon]);
}

function sendDroneLocation(){
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
   pos=>{
    updateDronePosition(pos.coords.latitude,pos.coords.longitude);
    fetch(`${BASE_URL}/alert`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lat:pos.coords.latitude,lon:pos.coords.longitude,is_drone:true})
    });
   },
   ()=>console.warn("Geolocation failed")
  );
 }
}

if(navigator.geolocation){
 navigator.geolocation.getCurrentPosition(
  pos=>initMap(pos.coords.latitude,pos.coords.longitude),
  ()=>initMap(0,0)
 );
}else initMap(0,0);

setInterval(fetchData,1000);
setInterval(sendDroneLocation,1000);
setInterval(moveDroneSmooth,100);
</script>
</body>
</html>
